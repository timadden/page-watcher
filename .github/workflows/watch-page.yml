name: Watch Page

on:
  schedule:
    # Runs every 30 minutes. Edit the cron expression to change frequency.
    # GitHub's schedule times can lag a few minutes during high load — that's normal.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write  # needed so the workflow can commit the updated state.hash file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run watcher
        env:
          WATCH_URL: ${{ vars.WATCH_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_SELECTOR: ${{ vars.WATCH_SELECTOR }}
        run: python watch_page_cloud.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.hash
          git diff --staged --quiet || git commit -m "Update page state"
          git push
